# =========================================================
# User Guide Dialog
# =========================================================
guide.title=Panduan Penggunaan
guide.subtitle=Visualisasi B-Tree: sisipkan, hapus, dan cari kunci.
guide.1.title=Operasi manual
guide.1.desc=Ketik angka, lalu klik <b>Sisipkan</b> atau <b>Hapus</b>.
guide.2.title=Input batch
guide.2.desc=Pisahkan angka dengan koma (mis. <font face='Monospaced'>10, 20, 30</font>), pilih mode, lalu klik <b>Proses Batch</b>.
guide.3.title=Pencarian
guide.3.desc=Jalur penelusuran ditandai <b>garis oranye</b>; kunci yang sedang dibandingkan ditandai <b>teks merah</b>.
guide.4.title=Kontrol animasi
guide.4.desc=Atur kecepatan dengan slider. Gunakan <b>Jeda</b> dan <b>Step</b> untuk melihat proses perlahan.
guide.legend.title=Legenda warna node
guide.legend.1=Node internal (beberapa kunci)
guide.legend.2=Node daun (berisi kunci data)
guide.legend.3=Node yang sedang dikunjungi / di-split
guide.btn=Mengerti

# =========================================================
# Import Template Dialog
# =========================================================
template.title=Template File Import Data
template.subtitle=Panduan format file teks (.txt) untuk mengimpor data batch secara instan.
template.1.title=Konfigurasi Opsional
template.1.desc=Gunakan <b>ORDER=n</b> (atau <b>ORDE=n</b>) untuk mengatur orde, dan <b>TYPE=NUMERIC/STRING</b> (atau <b>TYPE=NUMERIK/TEKS</b>) untuk mengatur tipe kunci di baris paling atas.
template.2.title=Daftar Kunci Data
template.2.desc=Masukkan kunci data (maksimal 20 item). Anda bisa memisahkannya dengan koma dalam satu baris, atau menuliskannya satu kunci per baris.
template.3.title=Cara Mengimpor
template.3.desc=Simpan file sebagai <b>.txt</b>. Buka menu <b>File &gt; Import Data</b>, pilih file tersebut, lalu klik <b>Proses Batch</b> di panel kiri.
template.preview.title=Contoh Format File
template.btn_save=Simpan Template ke File
template.btn_close=Tutup
template.save_success=Template berhasil disimpan!
template.save_fail=Gagal menyimpan template.

