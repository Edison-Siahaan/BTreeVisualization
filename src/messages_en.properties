# =========================================================
# User Guide Dialog
# =========================================================
guide.title=User Guide
guide.subtitle=B-Tree Visualization: insert, delete, and search keys.
guide.1.title=Manual operation
guide.1.desc=Type a number, then click <b>Insert</b> or <b>Delete</b>.
guide.2.title=Batch input
guide.2.desc=Separate numbers with commas (e.g., <font face='Monospaced'>10, 20, 30</font>), choose a mode, then click <b>Process Batch</b>.
guide.3.title=Search
guide.3.desc=The search path is marked with an <b>orange line</b>; the key being compared is marked with <b>red text</b>.
guide.4.title=Animation control
guide.4.desc=Adjust the speed with the slider. Use <b>Pause</b> and <b>Step</b> to view the process slowly.
guide.legend.title=Node color legend
guide.legend.1=Internal node (multiple keys)
guide.legend.2=Leaf node (contains data keys)
guide.legend.3=Node being visited / split
guide.btn=Got it

# =========================================================
# Import Template Dialog
# =========================================================
template.title=Import Data Template
template.subtitle=Text file (.txt) format guide for instantly importing batch data.
template.1.title=Optional Configuration
template.1.desc=Use <b>ORDER=n</b> (or <b>ORDE=n</b>) to set the order, and <b>TYPE=NUMERIC/STRING</b> (or <b>TYPE=NUMERIK/TEKS</b>) to set the key type at the very top lines.
template.2.title=Data Keys List
template.2.desc=Enter the data keys (max 20 items). You can separate them with commas on a single line, or write one key per line.
template.3.title=How to Import
template.3.desc=Save the file as <b>.txt</b>. Open the <b>File &gt; Import Data</b> menu, select the file, then click <b>Process Batch</b> on the left panel.
template.preview.title=File Format Example
template.btn_save=Save Template to File
template.btn_close=Close
template.save_success=Template saved successfully!
template.save_fail=Failed to save template.

